[package]
name = "tn-gateway"
version.workspace = true
edition.workspace = true

[[bin]]
name = "tn-gateway"
path = "src/main.rs"

[dependencies]
tn-common = { path = "../common" }
tn-domain = { path = "../domain" }
tn-infra  = { path = "../infra", features = ["postgres"] }
tn-auth-service   = { path = "../auth-service" }
tn-notes-service  = { path = "../notes-service" }
tn-collab-service = { path = "../collab-service" }
tn-ai-agent-service = { path = "../ai-agent-service" }

tokio = { workspace = true }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-graphql = { workspace = true }
async-graphql-actix-web = { workspace = true }
actix-web = { workspace = true }
actix-cors = { workspace = true }
futures = { workspace = true }
base64 = "0.22"

[features]
default = ["postgres"]
postgres = ["tn-infra/postgres"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

