[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/domain",
    "crates/infra",
    "crates/auth-service",
    "crates/notes-service",
    "crates/collab-service",
    "crates/ai-agent-service",
    "crates/gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["TokioNotes Contributors"]
repository = "https://github.com/abhijeet/TokioNotes"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
async-graphql = { version = "7", features = ["chrono", "uuid"] }
async-graphql-actix-web = "7"
actix-web = "4"
actix-cors = "0.7"
actix-web-actors = "4"
sqlx = { version = "0.8", features = ["postgres", "uuid", "macros", "runtime-tokio-rustls", "migrate", "chrono", "json"] }
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
dashmap = "6"
yrs = "0.21"
redis = { version = "0.27", features = ["tokio-comp", "aio", "connection-manager"] }
tokio-retry = "0.3"
config = "0.14"
once_cell = "1"
mockall = "0.13"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

