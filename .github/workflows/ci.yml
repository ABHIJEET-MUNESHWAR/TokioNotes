name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust workspace (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --all-features

  frontend:
    name: Next.js frontend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build

  docker:
    name: Build & publish container images
    needs: [rust, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # required to push to ghcr.io
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # Only authenticate + push on pushes to main. PR builds still run
      # `build` (push: false) so Dockerfile regressions are caught, but the
      # GITHUB_TOKEN is never exposed to forked-PR workflows.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"   # ghcr.io requires lowercase
          echo "gateway_tags=${REGISTRY}/${OWNER_LC}/tokionotes-gateway:latest,${REGISTRY}/${OWNER_LC}/tokionotes-gateway:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_tags=${REGISTRY}/${OWNER_LC}/tokionotes-frontend:latest,${REGISTRY}/${OWNER_LC}/tokionotes-frontend:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build & push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.gateway_tags }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.frontend_tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

