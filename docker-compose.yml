version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tokionotes
      POSTGRES_USER: tn
      POSTGRES_PASSWORD: tn
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      # `-d` is required: without it, pg_isready probes a database named
      # after the user (`tn`) which doesn't exist and the check fails with
      # `FATAL: database "tn" does not exist`.
      test: ["CMD-SHELL", "pg_isready -U tn -d tokionotes"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # One-shot job: applies every SQL file under ./migrations in order.
  # Idempotent — every statement is `IF NOT EXISTS` / `ON CONFLICT`.
  migrator:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: tn
      PGPASSWORD: tn
      PGDATABASE: tokionotes
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'set -e;
       echo "applying migrations…";
       for f in /migrations/*.sql; do
         echo " → $$f";
         psql -v ON_ERROR_STOP=1 -f "$$f";
       done;
       echo "migrations done.";'
    restart: "no"

  gateway:
    build: .
    environment:
      JWT_SECRET: dev-secret-change-me
      BIND: 0.0.0.0:9090
      DATABASE_URL: postgres://tn:tn@postgres:5432/tokionotes
      REDIS_URL: redis://redis:6379
    ports: ["9090:9090"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrator:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_GRAPHQL_HTTP: http://localhost:9090/graphql
      NEXT_PUBLIC_GRAPHQL_WS: ws://localhost:9090/graphql
    ports: ["9000:9000"]
    depends_on: [gateway]

volumes:
  pgdata: {}

